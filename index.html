<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooftop Anthology — 5-Scenario Isometric Pixel Diorama</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <main class="stage" id="stage">
    <!-- Top Scene Selector & 5-Scenario Progress Bars -->
    <header class="top-bar">
      <div class="scene-picker" id="scene-picker">
        <button
          class="scene-trigger"
          id="scene-trigger"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Switch scenario (Keys 1–5)"
        >
          <span class="scene-title" id="scene-title">Sudden Squall</span>
          <svg class="chevron" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
            <path d="M3 4.5L6 7.5L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="scene-menu" id="scene-menu" role="listbox" aria-label="Select scenario" hidden>
          <!-- Populated by ui.js -->
        </div>
      </div>

      <div class="scene-segments" id="scene-segments" role="tablist" aria-label="Scenarios">
        <!-- 5 progress segments populated by ui.js -->
      </div>
    </header>

    <!-- Main Isometric Pixel Canvas -->
    <section class="diorama-viewport" id="diorama-viewport">
      <canvas
        id="diorama-canvas"
        width="350"
        height="264"
        aria-label="Interactive isometric pixel-art rooftop diorama"
      ></canvas>
      <div class="interact-toast" id="interact-toast" aria-live="polite"></div>
    </section>

    <!-- Bottom Transport & Time Scrubber -->
    <footer class="bottom-bar">
      <div class="transport-row">
        <button
          class="icon-btn"
          id="btn-play"
          type="button"
          aria-label="Pause simulation"
          title="Play / Pause (Space)"
        >
          <svg class="icon-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <rect x="4" y="3" width="2.6" height="10" rx="0.8" fill="currentColor" />
            <rect x="9.4" y="3" width="2.6" height="10" rx="0.8" fill="currentColor" />
          </svg>
          <svg class="icon-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M4.5 3.2L12.5 8L4.5 12.8V3.2Z" fill="currentColor" />
          </svg>
        </button>

        <div
          class="scrubber"
          id="scrubber"
          role="slider"
          tabindex="0"
          aria-label="Time of day"
          aria-valuemin="0"
          aria-valuemax="1440"
          aria-valuenow="1007"
          aria-valuetext="16:47"
        >
          <div class="scrubber-track" id="scrubber-track">
            <div class="scrubber-fill" id="scrubber-fill"></div>
            <div class="scrubber-ticks" id="scrubber-ticks"></div>
            <div class="scrubber-thumb" id="scrubber-thumb"></div>
          </div>
        </div>

        <span class="time-readout" id="time-readout">16:47</span>

        <button
          class="mode-pill"
          id="btn-tour"
          type="button"
          aria-pressed="true"
          title="Toggle 5×10s auto-tour across all 5 scenarios"
        >5×10s</button>

        <button
          class="icon-btn"
          id="btn-audio"
          type="button"
          aria-pressed="false"
          aria-label="Toggle ambient audio"
          title="Toggle ambient sound (M)"
        >
          <svg class="icon-muted" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M2.8 6.2H5.4L8.6 3.5V12.5L5.4 9.8H2.8V6.2Z" fill="currentColor" />
            <path d="M11 6L13.8 10M13.8 6L11 10" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
          </svg>
          <svg class="icon-unmuted" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M2.8 6.2H5.4L8.6 3.5V12.5L5.4 9.8H2.8V6.2Z" fill="currentColor" />
            <path d="M10.8 5.6C11.6 6.3 12 7.1 12 8C12 8.9 11.6 9.7 10.8 10.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="M12.5 3.9C13.7 5 14.3 6.4 14.3 8C14.3 9.6 13.7 11 12.5 12.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <p class="hint-line">
        Click zombies to shoot &middot; Click diorama to interact &middot; Drag slider &middot; Keys 1&ndash;5 &middot; Z wave
      </p>
    </footer>
  </main>

  <script src="src/palette.js"></script>
  <script src="src/pixelBuffer.js"></script>
  <script src="src/iso.js"></script>
  <script src="src/scenarios.js"></script>
  <script src="src/architecture.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
